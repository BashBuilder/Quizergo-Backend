<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <!-- Modern Quizergo Logo -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="gradient2" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient2)" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Graduation cap base -->
  <path d="M65 110 C65 95, 85 80, 100 80 C115 80, 135 95, 135 110 L135 95 C135 82, 115 72, 100 72 C85 72, 65 82, 65 95 Z" fill="#2563eb"/>
  
  <!-- Cap top -->
  <path d="M85 72 L100 62 L115 72 Z" fill="#2563eb"/>
  
  <!-- Cap tassel -->
  <circle cx="100" cy="77" r="3" fill="#f97316"/>
  
  <!-- Lightbulb filament -->
  <path d="M100 125 C100 118, 108 118, 108 125 C108 132, 100 132, 100 125 Z" fill="#f97316"/>
  <path d="M100 132 C95 135, 95 138, 100 141 C105 138, 105 135, 100 132 Z" fill="#f97316"/>
  
  <!-- Quizergo text -->
  <text x="100" y="175" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="48" fill="#1e293b" text-anchor="middle" letter-spacing="-1">
    QUIZE<span style="fill:#f97316;">RO</span>GO
  </text>
</svg>